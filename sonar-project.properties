# Análise estática e de segurança no SonarQube Cloud, enviada pelo job "sonarqube" do CI.
sonar.organization=lgceola
sonar.projectKey=LGCeola_talentix-portfolio
sonar.projectName=Talentix

# Código analisado: backend (Python) e frontend (Vue/JS).
sonar.sources=apps/backend,apps/web/src
sonar.tests=apps/backend/tests,apps/web/src
sonar.test.inclusions=apps/web/src/**/*.spec.js,apps/backend/tests/**
sonar.exclusions=apps/web/src/**/*.spec.js,apps/backend/tests/**,apps/backend/migrations/**,apps/backend/evaluation/**,apps/web/src/assets/**

# Fora da cobertura pelo mesmo motivo que no .coveragerc e no vite.config.js.
sonar.coverage.exclusions=apps/backend/migrations/**,apps/backend/evaluation/**,apps/web/src/main.js,infra/**
# infra/: script de uso único para criar os bancos (rodado à mão na criação da infraestrutura) e arquivos Bicep.

sonar.python.version=3.14
sonar.sourceEncoding=UTF-8

# Relatórios gerados pelos jobs de teste e baixados no job de análise.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info

# Exceções revisadas, cada uma com o motivo:
sonar.issue.ignore.multicriteria=vueSlotted,internalApiCert
# :slotted() é um seletor do Vue para estilizar o conteúdo de slots; a regra de CSS puro não o conhece.
sonar.issue.ignore.multicriteria.vueSlotted.ruleKey=css:S4659
sonar.issue.ignore.multicriteria.vueSlotted.resourceKey=apps/web/src/**/*.vue
# Certificado de cliente na API: a API só tem endereço interno (inacessível pela internet) e só o Nginx do
# próprio ambiente a chama; a autenticação dos usuários é feita por JWT em cada rota.
sonar.issue.ignore.multicriteria.internalApiCert.ruleKey=azureresourcemanager:S6382
sonar.issue.ignore.multicriteria.internalApiCert.resourceKey=infra/environment.bicep
